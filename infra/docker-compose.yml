name: indexflow

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: indexflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: indexflow
      POSTGRES_PASSWORD: indexflow
      POSTGRES_DB: indexflow
    ports:
      - "5440:5432"
    volumes:
      - indexflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indexflow -d indexflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: indexflow-redis
    restart: unless-stopped
    ports:
      - "6380:6379" # host 6380 (6379 is commonly taken) → container 6379
    volumes:
      - indexflow_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: indexflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9101"
    environment:
      MINIO_ROOT_USER: indexflow
      MINIO_ROOT_PASSWORD: indexflow123
    ports:
      - "9100:9000" # S3 API
      - "9101:9101" # web console
    volumes:
      - indexflow_miniodata:/data

volumes:
  indexflow_pgdata:
  indexflow_miniodata:
  indexflow_redisdata:
